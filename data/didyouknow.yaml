- fact: "[Cannabis](articles/cannabis) has been cultivated by humans for over 10,000 years."
- fact: "There are over 100 different [cannabinoids](articles/cannabinoids) found in the cannabis plant."
- fact: "[Terpenes](articles/terpenes) are responsible for the unique smell of each cannabis strain."
- fact: "[Cannabis ruderalis](articles/cannabis-ruderalis) autoflowers regardless of the light cycle."
- fact: The word "canvas" is derived from "[cannabis](articles/cannabis)" — [hemp](articles/hemp) was historically used to make sails and canvas.
- fact: "You can [train](articles/training) your cannabis plant to grow taller by providing it with support, or create art like [cannabis bonsai](articles/cannabis-bonsai)!"