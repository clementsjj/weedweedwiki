{{ define "main" }}
{{ $articlePage := .GetPage (printf "/articles/%s" .File.ContentBaseName) }}
<div class="article-layout">
  <main class="article-main talk-page">
    <article class="article">
      <header class="article-header">
        <h1 class="article-title">Talk: {{ .Title }}</h1>
      </header>

      <div class="article-toolbar">
        <div class="toolbar-left">
          {{ with $articlePage }}
          <a href="{{ .RelPermalink }}" class="toolbar-tab">Article</a>
          {{ end }}
          <span class="toolbar-tab active">Talk</span>
        </div>
        <div class="toolbar-right">
        </div>
      </div>

      <div class="article-content">
        {{ .Content }}

        <div class="talk-discussions">
          <script src="https://giscus.app/client.js"
            data-repo="{{ .Site.Params.githubRepo | replaceRE "https://github.com/" "" }}"
            data-repo-id="{{ .Site.Params.giscusRepoId }}"
            data-category="{{ .Site.Params.giscusCategory | default "Discussions" }}"
            data-category-id="{{ .Site.Params.giscusCategoryId }}"
            data-mapping="specific"
            data-term="{{ .Title }}"
            data-strict="0"
            data-reactions-enabled="1"
            data-emit-metadata="0"
            data-input-position="top"
            data-theme="dark"
            data-lang="en"
            data-loading="lazy"
            crossorigin="anonymous"
            async>
          </script>
        </div>
      </div>
    </article>
  </main>
</div>
{{ end }}
